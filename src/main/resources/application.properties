spring.application.name=PoeNaLista

# Perfil padrão (desenvolvimento): banco H2 em memória, recriado a cada execução.
spring.datasource.url=jdbc:h2:mem:poenalista
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Console do H2 em http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:poenalista)
spring.h2.console.enabled=true

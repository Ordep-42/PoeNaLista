spring.application.name=PoeNaLista

# Perfil padrão (desenvolvimento): banco H2 em memória, em modo PostgreSQL, recriado a cada execução.
# O schema é criado pelas migrations Flyway (db/migration); o Hibernate só valida.
spring.datasource.url=jdbc:h2:mem:poenalista;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Console do H2 em http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:poenalista)
spring.h2.console.enabled=true

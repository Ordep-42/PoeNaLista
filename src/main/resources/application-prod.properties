# Perfil de produção: PostgreSQL. Ativar com SPRING_PROFILES_ACTIVE=prod.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/poenalista}
spring.datasource.username=${DATABASE_USERNAME:poenalista}
spring.datasource.password=${DATABASE_PASSWORD:poenalista}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
